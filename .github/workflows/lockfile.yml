name: lockfile
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/lockfile.yml']
permissions:
  contents: write
jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Generate package-lock.json (only when missing)
        run: |
          if [ ! -f package-lock.json ]; then npm install --package-lock-only --ignore-scripts; fi
          ls -la package-lock.json
      - name: Dependency audit
        run: |
          set +e
          npm audit --json > audit.json; npm audit > audit.txt
          msg=$(head -c 3500 audit.txt | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g'); echo "::notice title=npm audit::$msg"
          node -e "const a=require('./audit.json');console.log(JSON.stringify(a.metadata?.vulnerabilities||a))"
      - name: Commit lockfile
        run: |
          git config user.name "github-actions"; git config user.email "actions@users.noreply.github.com"
          git add package-lock.json
          git diff --cached --quiet || (git commit -m "chore: add package-lock.json" && git push)
