name: prod-qa
# Real browser / real database QA against the deployed production app + real Supabase. No mocks.
on:
  workflow_dispatch:
  push:
    branches: [main] # production only serves main; a branch push would wait for a deploy that never comes
    # Only changes that alter what production serves. Test-only, doc and native-app commits do not re-run the suites (each run sends thousands of requests to the Vercel project).
    paths: ['src/**', 'public/**', 'package.json', 'package-lock.json', 'next.config.mjs', 'tsconfig.json', 'postcss.config.mjs', 'vercel.json', 'scripts/vercel-ignore.sh', 'scripts/deployable-paths']
# One run at a time: overlapping runs share test users and were a source of flaky failures; a newer push replaces a waiting one.
concurrency:
  group: prod-qa
  cancel-in-progress: false
permissions:
  contents: write
env:
  BASE_URL: https://pera-app-beta.vercel.app
  SUPABASE_URL: https://vxhgkkzbmrhxayzryake.supabase.co
  SUPABASE_PUBLISHABLE_KEY: sb_publishable_YGZgbXB3xS6tP2ssvT8pCA_c3i4hRL2   # public by design (ships to every browser)
  OUT_DIR: ${{ github.workspace }}/qa-out
jobs:
  preflight:
    # The suites create throwaway users, which only works while Supabase "Confirm email" is OFF. Once you turn it ON for real users, skip them instead of failing every push.
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.p.outputs.skip }}
    steps:
      - id: p
        run: |
          auto=$(curl -s "$SUPABASE_URL/auth/v1/settings" -H "apikey: $SUPABASE_PUBLISHABLE_KEY" | jq -r '.mailer_autoconfirm')
          echo "mailer_autoconfirm=$auto"
          if [ "$auto" = "false" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice title=prod-qa skipped::Supabase 'Confirm email' is ON, so the suites that create test users were skipped (expected once real users are onboarded). Turn it off temporarily to run them."
          else echo "skip=false" >> "$GITHUB_OUTPUT"; fi
  qa:
    needs: preflight
    if: needs.preflight.outputs.skip != 'true'
    strategy:
      fail-fast: false
      matrix:
        suite: [qa, responsive, db, rls, security]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - name: Wait until production serves this push
        run: sh scripts/wait-for-deploy.sh
      - run: npm ci
      - name: Install Playwright
        working-directory: tests/prod
        run: |
          npm install --no-save --no-package-lock --ignore-scripts playwright@1.49.1
          [ "${{ matrix.suite }}" = qa ] || [ "${{ matrix.suite }}" = responsive ] || [ "${{ matrix.suite }}" = security ] && npx playwright install --with-deps chromium || true
      - name: Run ${{ matrix.suite }}
        id: run
        working-directory: tests/prod
        continue-on-error: true
        timeout-minutes: 25
        run: node --experimental-strip-types ${{ matrix.suite == 'db' && 'db.mjs' || matrix.suite == 'rls' && 'rls.mjs' || format('{0}.mjs', matrix.suite) }}
      - name: Summarise
        run: |
          s="${{ matrix.suite }}"; f="$OUT_DIR/$( [ $s = db ] && echo db || echo $s ).json"
          [ -f "$f" ] || { echo "::error title=$s::no final result file (crashed or timed out); see $s.partial.md on branch qa-$s"; exit 0; }
          node -e "
            const r=require('$f'); console.log('::notice title=$s summary::pass '+r.pass+' fail '+r.fail);
            for (const x of r.failed.slice(0,40)) console.log('::error title=$s FAIL::['+x.group+'] '+x.name+' :: '+String(typeof x.detail==='string'?x.detail:JSON.stringify(x.detail)).replace(/[\r\n%]/g,' ').slice(0,300));"
      - name: Publish results to branch qa-${{ matrix.suite }}
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -d "$OUT_DIR" ] || { echo "::warning::no qa-out directory"; exit 0; }
          rm -rf /tmp/qa && mkdir -p /tmp/qa && cp -r "$OUT_DIR"/. /tmp/qa/ && cd /tmp/qa
          echo "run for ${GITHUB_SHA} at $(date -u +%FT%TZ)" > RUN.txt
          # Vercel reads vercel.json from the branch being pushed. Without this file every result push became a (failing) deployment and used up the free 100-per-day limit.
          echo '{"git":{"deploymentEnabled":false}}' > vercel.json
          git init -q -b qa-${{ matrix.suite }} . && git config user.name github-actions && git config user.email actions@users.noreply.github.com
          git add -A && git commit -qm "prod-qa ${{ matrix.suite }} results for ${GITHUB_SHA::7}"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push -f origin qa-${{ matrix.suite }} 2>&1 | sed "s/${GH_TOKEN}/***/g" || echo "::error title=publish::push failed"
      - name: Fail if the suite failed
        run: '[ "${{ steps.run.outcome }}" = success ]'
  landing:
    # The landing page needs no account, so this runs even while Confirm email is ON (the user-creating suites above are skipped then).
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - name: Wait until production serves this push
        run: sh scripts/wait-for-deploy.sh
      - run: npm ci
      - name: Install Playwright
        working-directory: tests/prod
        run: |
          npm install --no-save --no-package-lock --ignore-scripts playwright@1.49.1
          npx playwright install --with-deps chromium
      - name: Run landing
        id: run
        working-directory: tests/prod
        continue-on-error: true
        run: node --experimental-strip-types landing.mjs
      - name: Summarise
        if: always()
        run: |
          f="$OUT_DIR/landing.json"
          [ -f "$f" ] || { echo "::error title=landing::no result file (crashed)"; exit 0; }
          node -e "const r=require('$f'); console.log('::notice title=landing summary::pass '+r.pass+' fail '+r.fail); for (const x of r.failed.slice(0,40)) console.log('::error title=landing FAIL::['+x.group+'] '+x.name+' :: '+String(typeof x.detail==='string'?x.detail:JSON.stringify(x.detail)).replace(/[\r\n%]/g,' ').slice(0,300));"
      - name: Fail if the suite failed
        run: '[ "${{ steps.run.outcome }}" = success ]'
