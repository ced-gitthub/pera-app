name: weekly-health
# Runs every Monday and on demand. If anything fails, GitHub emails the repository owner.
on:
  schedule: [{ cron: '0 1 * * 1' }]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - name: Dependency audit (fails on moderate or worse)
        run: npm audit --audit-level=moderate
      - run: npm run verify
      - run: npm run test:app
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-not-a-real-key
