name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install
      - run: npm run typecheck
      - run: npm test
      - name: App tests (server actions + pages vs in-memory Supabase stand-in)
        run: |
          set +e
          npm run test:app > e2e.log 2>&1; code=$?
          if [ $code -ne 0 ]; then msg=$(grep -vE '^\s*$' e2e.log | tail -c 7000 | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g'); echo "::error title=test:app output::$msg"; fi
          msg=$(tail -c 3000 e2e.log | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g'); echo "::notice title=test:app summary::$msg"
          tail -3 e2e.log
          exit $code
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-not-a-real-key
